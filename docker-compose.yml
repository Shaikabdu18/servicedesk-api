services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-ServiceDesk#2026}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Database__Provider: "SqlServer"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=ServiceDesk;User Id=sa;Password=${SA_PASSWORD:-ServiceDesk#2026};TrustServerCertificate=True"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-docker-dev-signing-key-replace-in-production-0123}"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
